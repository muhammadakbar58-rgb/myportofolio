{% if user.is_authenticated %}
<form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            aria-pressed="{{ project.is_starred|yesno:'true,false' }}"
            class="button button-star{% if project.is_starred %} is-starred{% endif %}"
            title="{% if project.starred_by.all %}Dibintangi oleh {{ project.starred_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if project.is_starred %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ project.starred_by.count }}</span>
    </button>
</form>
{% else %}
<a href="{% url 'main:login' %}?next={{ request.get_full_path|urlencode }}"
   class="button button-star"
   title="Login untuk memberi star">
    <span aria-hidden="true">&#9733;</span>
    Star
    <span class="star-count">{{ project.starred_by.count }}</span>
</a>
{% endif %}
